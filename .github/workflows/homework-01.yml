name: Homework 01

on:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "01"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install shared development dependencies
        run: python -m pip install -r ../requirements-dev.txt
      - name: Tests
        run: >-
          python -m coverage run --rcfile=../.coveragerc
          -m pytest tests
      - name: Coverage threshold
        run: python -m coverage report --rcfile=../.coveragerc
      - name: Flake8
        run: python -m flake8 --config=../.flake8 homework.py tests
      - name: Pylint
        run: >-
          python -m pylint --rcfile=../.pylintrc
          homework.py tests
